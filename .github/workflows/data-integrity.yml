name: data-integrity

# Tier 1 — no database, no secrets. Runs free on every push/PR and protects two things that
# are otherwise only "confirmed" in someone's memory:
#   1. the Data Tree harness gate itself is intact (proves it still goes RED for each break);
#   2. no client bundle calls a function the browser can't execute after the anon revoke.
#
# Tier 2 (DB-backed) is deliberately NOT wired here yet. It needs a DATABASE_URL secret, and the
# right credential is a read-only role (consumer_report_readonly) whose password is still a
# placeholder — NOT the write-capable `postgres` role. Add the tier-2 job only after that role is
# set up and confirmed. When it lands, tier-2 runs BOTH:
#   node docs/data-tree/verify.mjs        # live predicates (incl. the county-literal + provenance gates)
#   node docs/data-tree/roz-fixtures.mjs  # Roz runner Layer 1 — payload assertions over roz_test_fixtures
# (Layer 2 narration assertions are model-calling — run on demand / pre-release, never per push.)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate-selfcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Harness negative-control — the gate must demonstrably go red
        run: node docs/data-tree/verify.test.mjs

      - name: Report coverage-gap render smoke test — a gap never reads as a finding
        run: node lib/report-coverage.test.mjs

      - name: No client bundle calls a revoked (server-only) RPC
        run: node scripts/check-client-rpc.mjs
